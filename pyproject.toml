[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunt"
version = "0.3.0"
description = "AI智慧求职系统 - 纯CLI、本地运行、面向中国招聘市场"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AI Job Hunt Team"}]
keywords = ["job", "career", "ai", "cli", "recruitment", "china"]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "pydantic>=2.6.0",
    "litellm>=1.50.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.45.0",
]
pdf = [
    "weasyprint>=60.0",
    "PyPDF2>=3.0.0",
]
docx = [
    "python-docx>=1.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3.0",
]
full = [
    "job-hunt[browser,pdf,docx]",
]

[project.scripts]
job-hunt = "job_hunt.cli:main_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
