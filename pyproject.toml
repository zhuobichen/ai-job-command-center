[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunt"
version = "0.3.0"
description = "AI智慧求职系统 - 纯CLI、本地运行、AI驱动、面向中国招聘市场"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AI Job Hunt Team", email = "job-hunt@example.com"}]
keywords = ["job", "career", "ai", "cli", "recruitment", "china", "guangxi", "guangdong"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "litellm>=1.50.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.45.0",
]
pdf = [
    "weasyprint>=60.0",
    "PyPDF2>=3.0.0",
]
docx = [
    "python-docx>=1.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
    "pytest-timeout>=2.2",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
    "types-beautifulsoup4>=4.12.0",
]
full = [
    "job-hunt[browser,pdf,docx,dev]",
]

[project.scripts]
job-hunt = "job_hunt.cli:app"

[project.urls]
Homepage = "https://github.com/zhuobichen/ai-job-command-center"
Documentation = "https://github.com/zhuobichen/ai-job-command-center#readme"
Repository = "https://github.com/zhuobichen/ai-job-command-center"
Issues = "https://github.com/zhuobichen/ai-job-command-center/issues"
Changelog = "https://github.com/zhuobichen/ai-job-command-center/commits/main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_hunt = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011", "E501"]

[tool.ruff.isort]
known-first-party = ["job_hunt"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "playwright.*"
ignore = true

[[tool.mypy.overrides]]
module = "weasyprint.*"
ignore = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/job_hunt"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
